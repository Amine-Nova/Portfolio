<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  height: 100vh;
  background: #0f172a;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.matrix-container {
  width: 100%;
  height: 100%;
  background-color: #111928;
  perspective: 500px; /* depth for 3D effect */
  overflow: hidden;
}

.matrix-container {
  width: 100%;
  height: 100%;
  background-color: #111928;
  overflow: hidden;
}

.matrix-grid {
  width: 100%;
  height: 100%;
  background: 
    linear-gradient(#262645 1px, transparent 1px),
    linear-gradient(90deg, #262645 1px, transparent 1px);
  background-size: 50px 50px, 50px 50px;
  animation: moveDown 3s linear infinite;
}

/* Move the lines down */
@keyframes moveDown {
  0% {
    background-position: 0 0, 0 0;
  }
  100% {
    background-position: 0 50px, 0 0;
  }
}

</style>
</head>
<body>

<div class="matrix-container matrix-grid">
  <div style="position: relative; z-index: 1; color: white; text-align: center;">
    <h1>Welcome to My Page</h1>
    <p>This is your content over the tilted squares background.</p>
  </div>
</div>

<!-- Your content -->

</body>
</html>
